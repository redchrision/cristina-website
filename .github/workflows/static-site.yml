# Builds the website as plain static files and publishes them to the
# `porkbun-site` branch. Porkbun Static Hosting is connected to that branch
# (GitHub Connect) and redeploys on every update.
#
# The static build has no backend, so the contact form is replaced by the
# email address (VITE_CONTACT_FORM=off). The Rust server is not involved.

name: Static site (Porkbun)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: static-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        working-directory: web
        env:
          VITE_CONTACT_FORM: "off"
        run: |
          npm ci
          npm run build
      - name: Publish web/dist to the porkbun-site branch
        working-directory: web/dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b porkbun-site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Static site built from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" porkbun-site
