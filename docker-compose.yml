# Local development and single-host production (e.g. an OVH VPS).
#
#   docker compose up -d                    # site + ClickHouse
#   docker compose --profile tunnel up -d   # + Cloudflare Tunnel (no open ports)
#
# Secrets come from a .env file next to this one (see .env.example).

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: site
      CLICKHOUSE_USER: site
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-local-dev-only}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ports:
      - "127.0.0.1:8123:8123"   # HTTP interface, loopback only
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 5s
      retries: 20

  site:
    build: .
    image: ghcr.io/redchrision/cristina-website:latest
    restart: unless-stopped
    depends_on:
      clickhouse: { condition: service_healthy }
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: site
      CLICKHOUSE_USER: site
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-local-dev-only}
      PUBLIC_HOSTS: ${PUBLIC_HOSTS:-}
      TRUST_CLOUDFLARE: ${TRUST_CLOUDFLARE:-false}
      HSTS: ${HSTS:-false}
      CONTACT_WEBHOOK_URL: ${CONTACT_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      CONTACT_NOTIFY_TO: ${CONTACT_NOTIFY_TO:-}
      CONTACT_NOTIFY_FROM: ${CONTACT_NOTIFY_FROM:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - site-data:/data
    ports:
      - "127.0.0.1:8080:8080"   # put a TLS proxy or the tunnel in front
      - "127.0.0.1:9090:9090"   # Prometheus / Datadog OpenMetrics scrape

  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:2025.10.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}   # required with --profile tunnel
    depends_on: [site]

volumes:
  clickhouse-data:
  site-data:
